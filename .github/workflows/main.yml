name: Check
'on': push
jobs:
  build:
    name: covr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Package Dependencies
        run: |-
          Rscript -e "install.packages(c('rcmdcheck', 'remotes', 'covr'), repos = 'https://demo.rstudiopm.com/all/__linux__/focal/latest')"
          Rscript -e "remotes::install_deps(dependencies = TRUE, repos = 'https://demo.rstudiopm.com/all/__linux__/focal/latest')"
      - name: codecov
        run: Rscript -e "covr::codecov(quiet = FALSE)"
    container: rocker/verse:latest
  rcmdchecker:
    name: Rcmdcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
      - name: Install Package Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Run Check
        uses: r-lib/actions/check-r-package@v2
    container: rocker/verse:latest
  test-r-sanitizers:
    name: ASAN-UBSAN
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: rhub/rocker-gcc-san
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5
          submodules: true
      - name: Install packages
        shell: bash
        run: |
          Rdevel -q -e "install.packages(c('data.table', 'fy', 'hutils', 'tinytest'))"
          Rdevel CMD build .
          Rdevel CMD INSTALL --install-tests *.tar.gz
      - name: Run tests under the sanitizers
        shell: bash
        # The suite no longer skips itself when the mirrored ABS data is
        # unavailable, so the instrumented C code is exercised even in this
        # container, which has no data and may have no network. Only the
        # files that genuinely need the ABS data skip themselves.
        run: |
          Rdevel -q -e "o <- tinytest::test_all('.'); print(o); if (!tinytest::all_pass(o)) q(status = 1L)"
