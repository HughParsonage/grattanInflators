name: Check
'on': push

permissions: read-all

jobs:
  build:
    name: covr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
      - name: Install Package Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage
      - name: Test Coverage
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(
              normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"),
              "package"
            )
          )
          print(cov)
          covr::to_cobertura(cov)
      - name: Upload Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./cobertura.xml
          plugins: noop
          use_oidc: true
  rcmdchecker:
    name: Rcmdcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
      - name: Install Package Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Run Check
        uses: r-lib/actions/check-r-package@v2
    container: rocker/verse:latest
  test-r-sanitizers:
    name: ASAN-UBSAN
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: rhub/rocker-gcc-san
    steps:
      - name: Checkout repository
        # This container intentionally has no Git client, so checkout uses its
        # REST archive fallback. The repository has no submodules, and asking
        # for them makes that fallback fail before the sanitizer can run.
        uses: actions/checkout@v6
      - name: Install packages
        shell: bash
        run: |
          Rdevel -q -e "install.packages(c('data.table', 'fy', 'hutils', 'tinytest'))"
          Rdevel CMD build .
          Rdevel CMD INSTALL --install-tests ./*.tar.gz
      - name: Run tests under the sanitizers
        shell: bash
        # The suite no longer skips itself when the mirrored ABS data is
        # unavailable, so the instrumented C code is exercised even in this
        # container, which has no data and may have no network. Only the
        # files that genuinely need the ABS data skip themselves.
        run: |
          Rdevel -q -e "o <- tinytest::test_all('.'); print(o); if (!tinytest::all_pass(o)) q(status = 1L)"
